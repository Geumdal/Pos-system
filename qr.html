<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>가든교회 물품 판매 관리 시스템 - QR생성</title>
  <script>
    // 로컬 호스팅 우선 + 여러 CDN fallback
    // 로컬 파일이 있으면 즉시 사용 (가장 빠르고 안정적)
    function loadScript(urls, name) {
      return new Promise((resolve, reject) => {
        let idx = 0;
        function tryNext() {
          if (idx >= urls.length) {
            console.error(`❌ ${name} 로딩 실패 (모든 소스 시도)`);
            reject(new Error(`${name} 로딩 실패`));
            return;
          }
          const script = document.createElement('script');
          script.src = urls[idx];
          script.async = false;
          script.onload = () => {
            console.log(`✅ ${name} 로드됨: ${urls[idx]}`);
            resolve();
          };
          script.onerror = () => {
            console.warn(`⚠️ 소스 실패 (${idx + 1}/${urls.length}): ${urls[idx]}`);
            idx++;
            tryNext();
          };
          document.head.appendChild(script);
        }
        tryNext();
      });
    }

    window.LIBS_LOADED = Promise.all([
      loadScript([
        'assets/qrcode.min.js',  // 로컬 (가장 안정적)
        'https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.js',
        'https://unpkg.com/qrcode@1.5.3/build/qrcode.js',
        'https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js'
      ], 'QRCode'),
      loadScript([
        'assets/jszip.min.js',   // 로컬 (가장 안정적)
        'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js',
        'https://unpkg.com/jszip@3.10.1/dist/jszip.min.js',
        'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js'
      ], 'JSZip')
    ]);
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      padding: 0;
    }
    .container { max-width: 1200px; margin: 0 auto; padding: 0; }
    .content { padding: 16px; }

    header {
      background: #1d1d1f; color: white;
      padding: 0 16px;
      height: 56px;
      display: flex; justify-content: space-between; align-items: center;
      margin: 0 0 16px 0;
      border-radius: 0;
    }
    header h1 {
      font-size: 16px; font-weight: 700;
      display: inline-flex; align-items: center; gap: 6px;
    }
    header .menu, header .nav {
      display: flex; gap: 6px; align-items: center;
    }
    .header-btn, .nav-btn {
      background: rgba(255,255,255,0.12); color: white;
      padding: 7px 13px; border: none; border-radius: 16px;
      font-size: 13px; text-decoration: none;
      display: inline-flex; align-items: center; gap: 4px;
      transition: background 0.15s;
      white-space: nowrap;
      cursor: pointer; font-family: inherit;
    }
    .header-btn:hover, .nav-btn:hover { background: rgba(255,255,255,0.2); }
    .header-btn.active, .nav-btn.active {
      background: white; color: #1d1d1f; font-weight: 700;
    }
    .header-btn.active:hover, .nav-btn.active:hover { background: white; }
    .nav-btn.primary { background: #007aff; color: white; }
    .nav-btn.success { background: #34c759; color: white; }
    .nav-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .action-row {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-bottom: 12px;
    }

    .panel {
      background: white;
      padding: 18px 20px;
      border-radius: 12px;
      margin-bottom: 14px;
    }
    .panel h2 {
      font-size: 14px; font-weight: 600;
      margin-bottom: 12px; color: #1d1d1f;
    }
    .panel-row {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 12px;
    }

    .options {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }
    .option-group label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #8e8e93;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .option-group select,
    .option-group input[type="number"],
    .option-group input[type="text"] {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #e5e5ea;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      background: white;
    }
    .checkbox-row {
      display: flex; gap: 14px; flex-wrap: wrap;
      align-items: center;
    }
    .checkbox-row label {
      display: inline-flex; align-items: center;
      gap: 6px; font-size: 13px; cursor: pointer;
      text-transform: none; letter-spacing: 0;
      font-weight: 400; color: #1d1d1f; margin-bottom: 0;
    }
    .checkbox-row input[type="checkbox"] {
      width: 18px; height: 18px;
    }

    .info-row {
      font-size: 12px; color: #8e8e93;
      padding: 10px 14px;
      background: #f5f5f7;
      border-radius: 8px;
      margin-bottom: 14px;
      display: flex; align-items: center; gap: 8px;
    }

    .qr-grid {
      display: grid;
      gap: 8px;
    }
    .qr-card {
      background: white;
      border: 1px dashed #c7c7cc;
      padding: 10px;
      text-align: center;
      border-radius: 6px;
      page-break-inside: avoid;
      break-inside: avoid;
      position: relative;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      box-sizing: border-box;
    }
    .qr-card canvas { display: block; margin: 0 auto; }
    .qr-name {
      font-weight: 700;
      font-size: 12px; margin-top: 5px;
      word-break: keep-all; line-height: 1.2;
    }
    .qr-id {
      font-size: 10px;
      color: #8e8e93;
      font-family: Menlo, Consolas, monospace;
      margin-top: 2px;
    }
    .qr-price {
      font-size: 11px;
      color: #ff3b30;
      margin-top: 2px;
      font-weight: 600;
    }
    .qr-category {
      position: absolute;
      top: 4px; left: 4px;
      font-size: 9px;
      background: #f5f5f7;
      color: #666;
      padding: 1px 6px;
      border-radius: 8px;
    }
    .download-btn {
      position: absolute;
      top: 4px; right: 4px;
      width: 22px; height: 22px;
      padding: 0; border: none;
      border-radius: 50%;
      background: rgba(0,122,255,0.1);
      color: #007aff;
      font-size: 12px;
      display: flex; align-items: center; justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
      cursor: pointer;
    }
    .qr-card:hover .download-btn { opacity: 1; }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: #8e8e93;
      background: white;
      border-radius: 12px;
    }
    .loading {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .toast {
      position: fixed;
      top: 20px; left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(29,29,31,0.95);
      color: white;
      padding: 12px 20px;
      border-radius: 24px;
      z-index: 2000; opacity: 0;
      transition: all 0.3s;
      font-size: 14px;
      max-width: 90%;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.success { background: #34c759; }
    .toast.error { background: #ff3b30; }

    @media (max-width: 768px) {
      .options-grid { grid-template-columns: 1fr 1fr; }
      header {
        padding: 8px 12px;
        flex-direction: column;
        justify-content: center;
        align-items: stretch;
        gap: 6px;
        height: auto;
        min-height: 88px;
      }
      header h1 {
        font-size: 14px;
        text-align: center;
        justify-content: center;
      }
      header .menu, header .nav {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 4px;
        width: 100%;
      }
      .header-btn, .nav-btn {
        padding: 6px 4px;
        font-size: 11px;
        border-radius: 10px;
        gap: 2px;
        min-width: 0;
        overflow: hidden;
        justify-content: center;
      }

      /* 📱 모바일에서 QR 그리드 미리보기 - 화면에 맞게 자동 축소 */
      /* 인쇄 시에는 @media print에서 정확한 mm 크기 유지됨 */
      .qr-grid {
        grid-template-columns: repeat(3, 1fr) !important;  /* 3개 컬럼 균등 */
        max-width: 100% !important;
        gap: 4px !important;
        padding: 0 4px !important;
      }
      .qr-card {
        width: auto !important;        /* 인라인 mm 크기 무시 */
        height: auto !important;
        aspect-ratio: 1 / 1;            /* 정사각형 비율 유지 */
        padding: 4px !important;
        min-width: 0;
        overflow: hidden;
      }
      .qr-card canvas {
        width: 100% !important;
        height: auto !important;
        max-width: 100%;
      }
      .qr-name {
        font-size: 10px !important;
        margin-top: 2px !important;
        line-height: 1.2;
        word-break: break-word;
        overflow: hidden;
        text-overflow: ellipsis;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }
      .qr-id, .qr-price, .qr-category {
        font-size: 9px !important;
      }
      .download-btn {
        font-size: 14px !important;
        width: 22px !important;
        height: 22px !important;
        top: 2px !important;
        right: 2px !important;
      }
      /* 정보 알림 모바일 가독성 */
      .info-row {
        font-size: 12px;
        padding: 8px 12px !important;
        line-height: 1.5;
      }
    }

    /* 모바일 가로형 길이 카드 (Avery 5160 같은 1"×2.625") */
    @media (max-width: 768px) {
      .qr-card.landscape {
        aspect-ratio: 2.625 / 1;        /* 가로로 길쭉한 비율 */
      }
    }

    @media (max-width: 480px) {
      header h1 { font-size: 13px; }
      header h1 .label { display: inline; }
      .nav-btn .label, .header-btn .label { display: none; }
      .options-grid { grid-template-columns: 1fr; }

      /* 화면 매우 좁을 때는 2개 컬럼으로 (3개로는 너무 작음) */
      .qr-grid {
        grid-template-columns: repeat(2, 1fr) !important;
      }
    }

    @media print {
      body { background: white; padding: 0; margin: 0; }
      header, .panel, .info-row, .toast, .action-row { display: none !important; }
      .content { padding: 0 !important; margin: 0 !important; }
      .container { padding: 0 !important; margin: 0 !important; }
      .qr-card {
        border: none !important;
        border-radius: 0 !important;
        box-sizing: border-box !important;
        break-inside: avoid;
        /* 인쇄 시 정확한 mm 크기 복원 (모바일 미디어쿼리에서 변경한 값 무효화) */
        aspect-ratio: auto !important;
      }
      .qr-card.page-break { page-break-after: always; break-after: page; }
      .qr-card canvas {
        width: auto !important;
        height: auto !important;
      }
      /* 인쇄 시에는 인라인 스타일(mm 크기)을 그대로 사용 */
      .qr-grid.preset-mode {
        grid-template-columns: repeat(var(--cols, 3), var(--cell-w, 50.8mm)) !important;
        column-gap: var(--gap-x, 0) !important;
        row-gap: var(--gap-y, 0) !important;
        justify-content: center !important;
      }
      .qr-grid {
        max-width: none !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      .download-btn { display: none !important; }
      @page { margin: 8mm; }
    }
  </style>
<script src="config.js"></script>

  <script>
    const PRESETS = {
      // ─── Letter (미국 Avery) — 1" = 25.4mm ───
      // cols × rows = 한 시트당 스티커 수
      // marginTop/Bottom/Left/Right = 페이지 여백 (인치)
      'avery-22806':  { cols: 3,  rows: 4,  cellW: 50.8,  cellH: 50.8,  qrSize: 130, paddingMm: 2,   paper: 'letter',
                        marginTop: '1in',     marginBottom: '1in',     marginLeft: '0.5in',     marginRight: '0.5in',     gapX: 0,    gapY: 0    }, // 12칸
      'avery-22816':  { cols: 3,  rows: 3,  cellW: 63.5,  cellH: 63.5,  qrSize: 160, paddingMm: 3,   paper: 'letter',
                        marginTop: '1in',     marginBottom: '1in',     marginLeft: '0.5in',     marginRight: '0.5in',     gapX: 0,    gapY: 0    }, // 9칸
      'avery-5160':   { cols: 3,  rows: 10, cellW: 66.7,  cellH: 25.4,  qrSize: 70,  paddingMm: 1.5, paper: 'letter',
                        marginTop: '0.5in',   marginBottom: '0.5in',   marginLeft: '0.1875in',  marginRight: '0.1875in',  gapX: 3.18, gapY: 0    }, // 30칸 (셀 간 가로 간격 0.125")
      'avery-5163':   { cols: 2,  rows: 5,  cellW: 101.6, cellH: 50.8,  qrSize: 130, paddingMm: 2,   paper: 'letter',
                        marginTop: '0.5in',   marginBottom: '0.5in',   marginLeft: '0.155in',   marginRight: '0.155in',   gapX: 3.18, gapY: 0    }, // 10칸
      // ─── 자유 배치 (rows 없음 = 그냥 모든 제품 1장씩) ───
      'grid-small':   { cols: null, qrSize: 80 },
      'grid-medium':  { cols: null, qrSize: 120 },
      'grid-large':   { cols: null, qrSize: 180 }
    };

    let allProducts = [];
    let categories = [];

    // QR 라이브러리 어댑터 - node-qrcode와 davidshimjs/qrcodejs 둘 다 지원
    // 어떤 라이브러리가 로드되었는지 자동 감지
    function detectQRLibrary() {
      if (typeof QRCode === 'undefined') return null;
      // node-qrcode 라이브러리는 QRCode.toCanvas 메서드를 가짐
      if (typeof QRCode.toCanvas === 'function') return 'node-qrcode';
      // davidshimjs 라이브러리는 new QRCode(element)로 사용
      if (typeof QRCode === 'function') return 'davidshim';
      return null;
    }

    // 통합 API: 어떤 라이브러리든 동일하게 사용
    function drawQRToCanvas(canvas, text, options) {
      const lib = detectQRLibrary();
      if (!lib) throw new Error('QR 라이브러리가 로드되지 않음');

      if (lib === 'node-qrcode') {
        return new Promise((resolve, reject) => {
          QRCode.toCanvas(canvas, text, {
            width: options.width || 100,
            margin: options.margin || 1,
            errorCorrectionLevel: options.errorCorrectionLevel || 'M'
          }, err => err ? reject(err) : resolve());
        });
      } else {
        // davidshimjs: 임시 div에 그린 후 canvas로 옮김
        return new Promise((resolve) => {
          const tempDiv = document.createElement('div');
          tempDiv.style.display = 'none';
          document.body.appendChild(tempDiv);

          const errLevels = { 'L': QRCode.CorrectLevel.L, 'M': QRCode.CorrectLevel.M,
                              'Q': QRCode.CorrectLevel.Q, 'H': QRCode.CorrectLevel.H };
          new QRCode(tempDiv, {
            text: text,
            width: options.width || 100,
            height: options.width || 100,
            correctLevel: errLevels[options.errorCorrectionLevel] || QRCode.CorrectLevel.M
          });

          // davidshimjs는 canvas와 img를 둘 다 만듦. canvas를 우리 canvas로 복사
          setTimeout(() => {
            const generatedCanvas = tempDiv.querySelector('canvas');
            if (generatedCanvas) {
              canvas.width = generatedCanvas.width;
              canvas.height = generatedCanvas.height;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(generatedCanvas, 0, 0);
            } else {
              // canvas 없으면 img를 사용
              const img = tempDiv.querySelector('img');
              if (img) {
                canvas.width = options.width || 100;
                canvas.height = options.width || 100;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              }
            }
            document.body.removeChild(tempDiv);
            resolve();
          }, 50);
        });
      }
    }

    // 통합 API: dataURL로 변환
    function getQRDataURL(text, options) {
      const lib = detectQRLibrary();
      if (!lib) return Promise.reject(new Error('QR 라이브러리가 로드되지 않음'));

      if (lib === 'node-qrcode') {
        return new Promise((resolve, reject) => {
          QRCode.toDataURL(text, {
            width: options.width || 400,
            margin: options.margin || 2,
            errorCorrectionLevel: options.errorCorrectionLevel || 'M'
          }, (err, url) => err ? reject(err) : resolve(url));
        });
      } else {
        // davidshimjs: canvas에 그린 후 dataURL로 변환
        const tempCanvas = document.createElement('canvas');
        return drawQRToCanvas(tempCanvas, text, options).then(() => tempCanvas.toDataURL('image/png'));
      }
    }

    // QR 라이브러리 로딩 대기 헬퍼
    async function waitForQRCode(maxRetries = 50) {
      if (window.LIBS_LOADED) {
        try {
          await Promise.race([
            window.LIBS_LOADED,
            new Promise((_, reject) =>
              setTimeout(() => reject(new Error('timeout')), 8000)
            )
          ]);
        } catch (e) {
          // polling으로 다시 시도
        }
      }
      return new Promise((resolve, reject) => {
        let retries = 0;
        const check = () => {
          if (detectQRLibrary()) {
            const lib = detectQRLibrary();
            console.log(`✅ QR 라이브러리 감지: ${lib}`);
            resolve();
          } else if (retries++ >= maxRetries) {
            reject(new Error('QR 라이브러리 로딩 타임아웃'));
          } else {
            setTimeout(check, 100);
          }
        };
        check();
      });
    }

    window.addEventListener('load', async () => {
      try {
        await waitForQRCode();
        reload();
      } catch (err) {
        document.getElementById('grid').innerHTML = `
          <div style="grid-column: 1 / -1; padding: 40px; text-align: center; color: #ff3b30; background: #ffe5e1; border-radius: 12px;">
            ⚠️ QR 라이브러리 로딩 실패<br>
            <span style="font-size: 13px; color: #666;">CDN이 차단된 환경일 수 있습니다.<br>
            광고 차단기를 끄거나 다른 네트워크에서 시도하세요.</span><br>
            <button onclick="location.reload()" style="margin-top:12px; padding:8px 16px; background:#007aff; color:white; border:none; border-radius:8px; cursor:pointer;">🔄 다시 시도</button>
          </div>`;
      }
    });

    function reload() {
      document.getElementById('infoRow').innerHTML =
        '<span class="loading"></span> 제품 목록 불러오는 중...';
      document.getElementById('grid').innerHTML =
        '<div class="empty"><span class="loading"></span> 불러오는 중...</div>';

      api('getProducts')
        .then(res => { (onLoaded)(res); })
        .catch(err => { (err => {
          document.getElementById('infoRow').textContent = '오류: ' + (err.message || err);
          document.getElementById('grid').innerHTML =
            '<div class="empty">데이터를 불러올 수 없습니다</div>';
        })(err); });
    }

    function onLoaded(res) {
      if (!res.success) {
        showToast(res.message || '오류 발생', 'error');
        return;
      }
      allProducts = res.products || [];
      categories = res.categories || ['전체'];

      const select = document.getElementById('productFilter');
      // 카테고리별로 제품 그룹화 → optgroup 사용
      const byCategory = {};
      allProducts.forEach(p => {
        const cat = p.category || '기타';
        if (!byCategory[cat]) byCategory[cat] = [];
        byCategory[cat].push(p);
      });

      let html = '<option value="all">전체 제품</option>';
      Object.keys(byCategory).sort().forEach(cat => {
        html += `<optgroup label="${escapeHtml(cat)}">`;
        byCategory[cat].forEach(p => {
          const cleanName = cleanProductName(p.name);
          html += `<option value="${escapeHtml(p.id)}">${escapeHtml(cleanName)} (${escapeHtml(p.id)})</option>`;
        });
        html += '</optgroup>';
      });
      select.innerHTML = html;

      document.getElementById('infoRow').innerHTML =
        `📦 총 <strong>${allProducts.length}</strong>개 제품 · ${categories.length - 1}개 카테고리`;

      applyPreset();
    }

    function applyPreset() {
      const key = document.getElementById('presetSelect').value;
      updatePrintPaper(key);
      if (key === 'custom') { renderQRs(); return; }
      document.getElementById('qrSize').value = PRESETS[key].qrSize;
      renderQRs();
    }

    function updatePrintPaper(key) {
      let style = document.getElementById('dynamicPageStyle');
      if (!style) {
        style = document.createElement('style');
        style.id = 'dynamicPageStyle';
        document.head.appendChild(style);
      }
      const preset = PRESETS[key];
      let css;
      if (preset && preset.paper === 'letter' && preset.marginTop) {
        // Avery 정확한 마진 사용
        css = `@media print {
          @page {
            size: letter;
            margin-top: ${preset.marginTop};
            margin-right: ${preset.marginRight};
            margin-bottom: ${preset.marginBottom};
            margin-left: ${preset.marginLeft};
          }
          .qr-grid {
            column-gap: ${preset.gapX || 0}mm !important;
            row-gap: ${preset.gapY || 0}mm !important;
          }
        }`;
      } else if (preset && preset.paper === 'letter') {
        css = '@media print { @page { size: letter; margin: 0.5in; } }';
      } else if (preset && preset.paper === 'A4') {
        css = '@media print { @page { size: A4; margin: 8mm; } }';
      } else {
        css = '@media print { @page { margin: 8mm; } }';
      }
      style.textContent = css;

      const infoBox = document.getElementById('paperInfo');
      if (infoBox) {
        if (preset && preset.paper) {
          const paperLabel = preset.paper === 'letter' ? 'Letter (미국)' : 'A4 (한국/유럽)';
          infoBox.style.display = 'flex';
          infoBox.innerHTML = `🖨️ 인쇄 시 <strong style="margin: 0 4px;">${paperLabel}</strong> 용지를 사용하세요`;
        } else {
          infoBox.style.display = 'none';
        }
      }
    }

    function renderQRs() {
      const grid         = document.getElementById('grid');

      // renderQRs 내부에서 라이브러리 체크
      const lib = detectQRLibrary();
      if (!lib) {
        grid.innerHTML = `
          <div style="grid-column: 1 / -1; padding: 40px; text-align: center; color: #ff3b30; background: #ffe5e1; border-radius: 12px;">
            ⚠️ QR 라이브러리 로딩 실패<br>
            <span style="font-size: 13px; color: #666;">페이지를 새로고침하세요 (Ctrl+R)</span>
          </div>`;
        return;
      }

      const presetKey    = document.getElementById('presetSelect').value;
      const search       = document.getElementById('searchBox').value.trim().toLowerCase();
      const productFilter = document.getElementById('productFilter').value;
      const qrSize       = parseInt(document.getElementById('qrSize').value, 10) || 100;
      const errLevel     = document.getElementById('errorLevel').value;
      const showName     = document.getElementById('showName').checked;
      const showId       = document.getElementById('showId').checked;
      const showPrice    = document.getElementById('showPrice').checked;
      const showCategory = document.getElementById('showCategory').checked;

      const preset = PRESETS[presetKey];
      if (preset && preset.cols) {
        // CSS 변수로 저장 - 인쇄 시 @media print에서 활용
        grid.style.setProperty('--cols', preset.cols);
        grid.style.setProperty('--cell-w', preset.cellW + 'mm');
        grid.style.setProperty('--cell-h', preset.cellH + 'mm');
        grid.style.setProperty('--gap-x', (preset.gapX || 0) + 'mm');
        grid.style.setProperty('--gap-y', (preset.gapY || 0) + 'mm');
        grid.classList.add('preset-mode');
        // 화면 표시: PC에서는 mm 단위, 모바일에서는 CSS @media query가 덮어씀
        grid.style.gridTemplateColumns = `repeat(${preset.cols}, ${preset.cellW}mm)`;
        grid.style.justifyContent = 'center';
        grid.style.columnGap = (preset.gapX || 0) + 'mm';
        grid.style.rowGap = (preset.gapY || 0) + 'mm';
      } else {
        grid.classList.remove('preset-mode');
        grid.style.gridTemplateColumns = `repeat(auto-fill, minmax(${qrSize + 40}px, 1fr))`;
        grid.style.justifyContent = 'initial';
        grid.style.columnGap = '';
        grid.style.rowGap = '';
      }

      const baseFiltered = allProducts.filter(p => {
        if (productFilter !== 'all' && p.id !== productFilter) return false;
        if (!search) return true;
        return p.id.toLowerCase().includes(search) ||
               p.name.toLowerCase().includes(search) ||
               (p.category || '').toLowerCase().includes(search);
      });

      grid.innerHTML = '';

      if (baseFiltered.length === 0) {
        grid.innerHTML = '<div class="empty">' +
          (allProducts.length === 0
            ? 'Products 시트에 제품이 없습니다'
            : '필터에 맞는 제품이 없습니다') +
          '</div>';
        return;
      }

      // 인쇄 모드 (filtered = 현재 화면, all = 전체 일괄)
      const printModeEl = document.querySelector('input[name="printMode"]:checked');
      const printMode = printModeEl ? printModeEl.value : 'filtered';

      // 스티커 용지일 때: 한 페이지의 칸 수만큼 QR 반복 (각 제품을 페이지 가득 채움)
      // 자유 배치일 때: 1개씩 (기본 동작)
      let filtered;
      let pageBreakIndices = new Set();  // 인쇄 시 페이지 나누기 위치
      if (preset && preset.cols && preset.rows) {
        const sheetCount = preset.cols * preset.rows;
        filtered = [];
        baseFiltered.forEach((p, productIdx) => {
          for (let i = 0; i < sheetCount; i++) {
            filtered.push(p);
          }
          // "전체 제품 일괄" 모드일 때만 페이지 나누기 (제품마다 새 페이지)
          // "현재 화면 제품만" 모드는 페이지 나누지 않음 (마지막 제품 후엔 어차피 끝)
          if (printMode === 'all' && productIdx < baseFiltered.length - 1) {
            pageBreakIndices.add(filtered.length - 1);
          }
        });
      } else {
        filtered = baseFiltered;
      }

      filtered.forEach((p, idx) => {
        const card = document.createElement('div');
        card.className = 'qr-card';

        // 인쇄 시 페이지 나누기 (각 제품 그룹의 마지막 카드)
        if (pageBreakIndices.has(idx)) {
          card.classList.add('page-break');
        }

        if (preset && preset.cellH) {
          card.style.height  = preset.cellH + 'mm';
          card.style.width   = preset.cellW + 'mm';
          card.style.padding = preset.paddingMm + 'mm';
          // 가로형 스티커 감지 (가로 > 세로 1.5배 이상)
          if (preset.cellW > preset.cellH * 1.5) {
            card.classList.add('landscape');
          }
        }

        if (showCategory && p.category) {
          const catEl = document.createElement('div');
          catEl.className = 'qr-category';
          catEl.textContent = p.category;
          card.appendChild(catEl);
        }

        // 다운로드 버튼: 스티커 용지에서는 각 그룹의 첫 카드에만 표시 (중복 방지)
        // 첫 카드 = idx가 0이거나, 이전 카드가 page-break였음
        const isFirstOfGroup = idx === 0 || pageBreakIndices.has(idx - 1);
        if (!preset || !preset.rows || isFirstOfGroup) {
          const dlBtn = document.createElement('button');
          dlBtn.className = 'download-btn';
          dlBtn.textContent = '↓';
          dlBtn.title = 'PNG 다운로드';
          dlBtn.onclick = (e) => { e.stopPropagation(); downloadSingle(p, errLevel); };
          card.appendChild(dlBtn);
        }

        const canvas = document.createElement('canvas');
        card.appendChild(canvas);

        if (showName) {
          const name = document.createElement('div');
          name.className = 'qr-name';
          name.textContent = cleanProductName(p.name);
          card.appendChild(name);
        }
        if (showId) {
          const id = document.createElement('div');
          id.className = 'qr-id';
          id.textContent = p.id;
          card.appendChild(id);
        }
        if (showPrice && p.price > 0) {
          const price = document.createElement('div');
          price.className = 'qr-price';
          price.textContent = fmtUSD(p.price);
          card.appendChild(price);
        }

        grid.appendChild(card);

        drawQRToCanvas(canvas, p.id, {
          width: qrSize,
          margin: 1,
          errorCorrectionLevel: errLevel
        }).catch(err => console.error('QR 그리기 실패:', err));
      });

      const productCount = baseFiltered.length;
      const totalCount   = allProducts.length;
      const isSheet = preset && preset.cols && preset.rows;
      const stickersPerSheet = isSheet ? preset.cols * preset.rows : null;

      let counterText;
      if (isSheet) {
        const totalStickers = filtered.length;
        // "현재 화면 제품만" 모드: 항상 1페이지 (모든 제품이 한 시트에 섞임)
        // "전체 제품 일괄" 모드: 제품당 1페이지
        const totalPages = printMode === 'all' ? productCount : 1;
        const modeLabel  = printMode === 'all' ? '전체 일괄' : '현재 화면';
        counterText = `🖨️ <strong>${modeLabel}</strong> · ${productCount}개 제품 × ${stickersPerSheet}칸 = ` +
                      `<strong>${totalStickers}</strong>개 스티커 (${totalPages}페이지)`;
      } else {
        counterText = productCount === totalCount
          ? `📦 총 <strong>${totalCount}</strong>개 제품`
          : `🔍 <strong>${productCount}</strong>개 표시 중 (전체 ${totalCount}개)`;
      }
      document.getElementById('infoRow').innerHTML = counterText;
    }

    function downloadSingle(product, errLevel) {
      getQRDataURL(product.id, {
        width: 400,
        margin: 2,
        errorCorrectionLevel: errLevel
      }).then(dataUrl => {
        const a = document.createElement('a');
        a.href = dataUrl;
        const safeName = String(product.name).replace(/[\\/:*?"<>|]/g, '_');
        a.download = `qr_${product.id}_${safeName}.png`;
        a.click();
        showToast(`${product.name} 다운로드`, 'success');
      }).catch(err => {
        showToast('생성 실패: ' + err.message, 'error');
      });
    }

    async function downloadAllAsZip() {
      const search = document.getElementById('searchBox').value.trim().toLowerCase();
      const productFilter = document.getElementById('productFilter').value;
      const filtered = allProducts.filter(p => {
        if (productFilter !== 'all' && p.id !== productFilter) return false;
        if (!search) return true;
        return p.id.toLowerCase().includes(search) ||
               p.name.toLowerCase().includes(search);
      });

      if (filtered.length === 0) {
        showToast('다운로드할 제품이 없습니다', 'error');
        return;
      }

      const btn = document.getElementById('zipBtn');
      const originalText = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span class="loading"></span> 생성 중...';

      const errLevel = document.getElementById('errorLevel').value;
      const zip = new JSZip();

      try {
        for (const p of filtered) {
          const dataUrl = await getQRDataURL(p.id, {
            width: 400, margin: 2, errorCorrectionLevel: errLevel
          });
          const base64 = dataUrl.split(',')[1];
          const safeName = String(p.name).replace(/[\\/:*?"<>|]/g, '_');
          const folder = p.category ? `${p.category}/` : '';
          zip.file(`${folder}${p.id}_${safeName}.png`, base64, { base64: true });
        }

        const blob = await zip.generateAsync({ type: 'blob' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `QR_Codes_${new Date().toISOString().slice(0, 10)}.zip`;
        a.click();
        URL.revokeObjectURL(url);

        showToast(`${filtered.length}개 QR 코드 ZIP 다운로드 완료`, 'success');
      } catch (err) {
        showToast('ZIP 생성 실패: ' + err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = originalText;
      }
    }

    function showToast(msg, type) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast show ' + (type || '');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[m]));
    }
    function fmtUSD(amount) {
      const n = Number(amount) || 0;
      return '$' + n.toLocaleString('en-US', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }
  </script>
</body>
